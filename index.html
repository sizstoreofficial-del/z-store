<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Z Store - Top Up Game</title>
<meta name="description" content="Z Store - Top Up Diamond Game Cepat, Aman dan Terpercaya">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#171717;
line-height:1.5
}
header{
background:linear-gradient(135deg,#111827,#2563eb);
color:white;
padding:18px 6%;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:10;
box-shadow:0 3px 15px #0002
}
.logo{font-size:25px;font-weight:800}
.logo span{color:#60a5fa}
nav a{
color:white;
text-decoration:none;
margin-left:22px;
font-weight:600
}
.hero{
padding:65px 6%;
background:linear-gradient(135deg,#dbeafe,#eff6ff);
text-align:center
}
.hero h1{
font-size:42px;
margin-bottom:12px;
color:#111827
}
.hero p{
font-size:18px;
color:#4b5563;
margin-bottom:25px
}
.btn{
border:0;
border-radius:12px;
padding:13px 22px;
font-size:16px;
font-weight:700;
cursor:pointer;
background:#2563eb;
color:white;
transition:.2s
}
.btn:hover{transform:translateY(-2px)}
.container{
width:92%;
max-width:900px;
margin:35px auto
}
.card{
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 5px 25px #0000000d;
margin-bottom:22px
}
h2{
margin-bottom:18px;
font-size:23px
}
.games{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px
}
.game{
border:2px solid #e5e7eb;
border-radius:14px;
padding:20px;
cursor:pointer;
text-align:center;
transition:.2s
}
.game:hover,.game.active{
border-color:#2563eb;
background:#eff6ff
}
.game-icon{
font-size:45px;
margin-bottom:8px
}
.game strong{display:block;font-size:18px}
label{
display:block;
font-weight:700;
margin:14px 0 7px
}
input,select{
width:100%;
padding:13px;
border:1px solid #d1d5db;
border-radius:10px;
font-size:16px;
outline:none
}
input:focus,select:focus{
border-color:#2563eb
}
.denom{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
gap:12px
}
.nominal{
border:2px solid #e5e7eb;
border-radius:12px;
padding:15px;
cursor:pointer;
text-align:center;
background:white
}
.nominal.active{
border-color:#2563eb;
background:#eff6ff
}
.nominal b{display:block;color:#2563eb}
.payment{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px
}
.pay{
border:2px solid #e5e7eb;
border-radius:12px;
padding:17px 10px;
cursor:pointer;
text-align:center
}
.pay.active{
border-color:#2563eb;
background:#eff6ff
}
.pay-icon{
font-size:27px;
font-weight:800
}
.summary{
background:#111827;
color:white;
border-radius:15px;
padding:20px;
margin-top:20px
}
.summary-row{
display:flex;
justify-content:space-between;
padding:7px 0
}
.total{
font-size:22px;
font-weight:800;
border-top:1px solid #ffffff33;
margin-top:10px;
padding-top:15px
}
.order-btn{
width:100%;
margin-top:18px;
font-size:17px;
background:#16a34a
}
.notice{
background:#fff7ed;
border:1px solid #fed7aa;
padding:15px;
border-radius:12px;
margin-top:15px;
color:#9a3412
}
#paymentInfo{
display:none;
margin-top:18px;
padding:18px;
border-radius:12px;
background:#f3f4f6
}
.qris{
max-width:260px;
width:100%;
display:block;
margin:15px auto;
border-radius:12px
}
footer{
text-align:center;
padding:30px 15px;
background:#111827;
color:#9ca3af;
margin-top:50px
}
.modal{
display:none;
position:fixed;
inset:0;
background:#0009;
z-index:100;
align-items:center;
justify-content:center;
padding:20px
}
.modal-box{
background:white;
border-radius:18px;
padding:25px;
width:100%;
max-width:500px;
max-height:90vh;
overflow:auto
}
.close{
float:right;
font-size:25px;
cursor:pointer
}
.success{
text-align:center;
font-size:55
